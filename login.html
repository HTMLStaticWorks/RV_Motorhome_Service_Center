  <!-- Custom Stylesheets -->

  <style>
    body {
      background-color: var(--bg-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    .auth-card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 40px rgba(15, 39, 68, 0.08);
      transition: var(--transition-smooth);
    }
    
    body.dark-mode .auth-card {
      background: rgba(18, 30, 49, 0.75);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-lg);
    }
    
    .social-btn {
      background: rgba(15, 39, 68, 0.04);
      border: 1px solid rgba(15, 39, 68, 0.1);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 50px;
      font-weight: 500;
      transition: var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }
    
    .social-btn:hover {
      background: rgba(15, 39, 68, 0.08);
      color: var(--text-main);
      transform: translateY(-2px);
    }
    
    body.dark-mode .social-btn {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-light);
    }
    
    body.dark-mode .social-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-light);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      margin: 2rem 0;
    }
    
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(15, 39, 68, 0.1);
    }
    
    body.dark-mode .divider {
      color: rgba(255, 255, 255, 0.45);
    }
    
    body.dark-mode .divider::before,
    body.dark-mode .divider::after {
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    .utility-btn {
      border-color: var(--border-color) !important;
      color: var(--text-main) !important;
      transition: var(--transition-fast);
    }
    
    .utility-btn:hover {
      background: var(--primary) !important;
      color: var(--accent) !important;
      border-color: var(--primary) !important;
    }

    .auth-card a {
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .auth-card a:hover {
      text-decoration: underline;
    }

    /* Light mode text/form-control overrides */
    body:not(.dark-mode) .auth-card h1,
    body:not(.dark-mode) .auth-card label,
    body:not(.dark-mode) .auth-card .text-white {
      color: var(--text-main) !important;
    }
    body:not(.dark-mode) .auth-card p,
    body:not(.dark-mode) .auth-card .text-white-50,
    body:not(.dark-mode) .auth-card .small {
      color: var(--text-muted) !important;
    }
    body:not(.dark-mode) .auth-card h1,
    body:not(.dark-mode) .auth-card label,
    body:not(.dark-mode) .auth-card .text-white {
      color: var(--text-main) !important;
    }
    body:not(.dark-mode) .auth-card p,
    body:not(.dark-mode) .auth-card .text-white-50,
    body:not(.dark-mode) .auth-card .small {
      color: var(--text-muted) !important;
    }
    body:not(.dark-mode) .auth-card a {
      color: var(--accent) !important;
    }
    body:not(.dark-mode) .auth-card .form-control {
      background-color: rgba(15, 39, 68, 0.03) !important;
      border-color: rgba(15, 39, 68, 0.15) !important;
      color: var(--text-main) !important;
    }
    body:not(.dark-mode) .auth-card .form-control::placeholder {
      color: rgba(15, 39, 68, 0.45) !important;
    }
    body:not(.dark-mode) .auth-card .form-control:focus {
      background-color: #ffffff !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 0.25rem rgba(232, 128, 36, 0.25) !important;
    }
    
    /* Light mode form check / input-group button overrides */
    body:not(.dark-mode) .auth-card .form-check-input {
      border-color: rgba(15, 39, 68, 0.25) !important;
    }
    body:not(.dark-mode) .auth-card .input-group .btn {
      background-color: rgba(15, 39, 68, 0.03) !important;
      border-color: rgba(15, 39, 68, 0.15) !important;
      color: var(--text-main) !important;
    }

    /* Small screens customization */
    @media (max-width: 576px) {
      .auth-card .form-check-label {
        font-size: 11px !important;
      }
      .auth-card .form-check-input {
        width: 12px !important;
      }
      .auth-toggles {
        position: relative !important;
        top: 0 !important;
        right: 0 !important;
        left: auto !important;
        transform: none !important;
        margin: 0 0 15px auto !important;
        z-index: 1010;
      }
      body {
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        padding-top: 10px !important;
        padding-bottom: 24px !important;
      }
    }
  </style>
</head>
<body>

  <!-- Theme & RTL Toggles -->
  <div class="auth-toggles position-absolute top-0 end-0 m-4 d-flex gap-2" style="z-index: 1000;">
    <button class="utility-btn font-monospace" id="rtl-toggle" title="Toggle Text Direction" aria-label="Toggle RTL direction">RTL</button>
    <button class="utility-btn" id="theme-toggle" title="Toggle Light/Dark Mode" aria-label="Toggle dark mode">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </div>

  <!-- ==========================================================================
       Authentication Login Form
       ========================================================================== */ -->
  <div class="auth-card text-center reveal active">
    <!-- Brand Logo -->
    <a class="footer-logo justify-content-center mb-4" href="index.html">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM17 12V9.5h2.5l1.88 2.5H17z"/>
        </svg>
      </div>
      <div class="brand-text text-start">
        <span class="brand-name">RoadReady</span>
        <span class="brand-sub">RV & Motorhome Service</span>
      </div>
    </a>

    <h1 class="h3 text-white mb-2" style="font-weight: 500;">Welcome Back, RV Owner</h1>
    <p class="text-white-50 small mb-4">Enter credentials below to access your rig records and dashboard.</p>



    <!-- Credentials Form -->
    <form id="loginForm" class="text-start">
      <div class="mb-3">
        <label class="form-label text-white small">Email Address</label>
        <input type="email" class="form-control rounded-3 bg-opacity-10 bg-white border border-white border-opacity-25 text-white" placeholder="owner@roadreadyrv.com" value="pat.miller@rvtraveler.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white small mb-1">Password</label>
        <div class="input-group">
          <input type="password" id="loginPassword" class="form-control bg-opacity-10 bg-white border-white border-opacity-25 text-white" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" value="RoadReady2026!" required>
          <button class="btn border border-white border-opacity-25 bg-opacity-10 bg-white text-white d-flex align-items-center justify-content-center toggle-pwd-btn" type="button" id="togglePasswordBtn" style="width:46px;">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/></svg>
            <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash d-none" viewBox="0 0 16 16"><path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486z"/><path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/><path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"/></svg>
          </button>
        </div>
      </div>

      <div class="mb-4 d-flex justify-content-between align-items-center flex-nowrap gap-2">
        <div class="form-check p-0 text-white small mb-0 d-flex align-items-center gap-2" style="white-space: nowrap; flex-shrink: 0;">
          <input type="checkbox" class="form-check-input m-0 bg-transparent border border-white border-opacity-25 flex-shrink-0" id="rememberMe" checked>
          <label class="form-check-label m-0" for="rememberMe">Keep me logged in</label>
        </div>
        <a href="contact.html" class="small text-white-50 flex-shrink-0" dir="ltr" style="white-space: nowrap;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-premium-secondary w-100 justify-content-center py-3">Access Owner Portal</button>
    </form>

    <div class="divider">or sign in with</div>

    <!-- Social Sign In buttons -->
    <div class="d-flex flex-column gap-2 mb-3">
      <button class="social-btn" type="button" onclick="socialLogin('Google')">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16"><path d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0c2.158 0 4 .799 5.418 2.301l-2.432 2.432C10.02 3.791 9.122 3.4 8 3.4c-2.445 0-4.437 1.992-4.437 4.437s1.992 4.437 4.437 4.437c2.827 0 3.87-1.992 4.04-3.036H8v-3.036z"/></svg>
        Sign in with Google
      </button>
      <button class="social-btn" type="button" onclick="socialLogin('Apple')">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-apple" viewBox="0 0 16 16"><path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.202-.087 2.22-1.258C11.217 1.282 11.206.046 11.182.008m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422.212-2.189 2.225-2.869 2.225-2.869-1.094-1.628-2.807-1.846-3.38-1.896-1.575-.192-3.084.881-3.864.881-.79 0-1.996-.86-3.23-.836-1.58.026-3.036.902-3.842 2.28-1.636 2.784-.419 6.892 1.171 9.145.78 1.093 1.688 2.302 2.871 2.261 1.146-.04 1.58-.724 2.955-.724 1.365 0 1.77.724 2.97.704 1.218-.02 2.012-1.127 2.783-2.24 1.002-1.455 1.41-2.866 1.428-2.937a1.05 1.05 0 0 1-.005-.002z"/></svg>
        Sign in with Apple
      </button>
    </div>

    <div class="mt-4 text-white-50 small">
      Don't have a registered coach? <a href="register.html" class="text-white">Register your RV here</a>
    </div>
  </div>

  <!-- Core Javascript -->
  <script src="assets/js/main.js"></script>

  <script>
    // Visibility toggle script
    const passwordInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeSlashIcon = document.getElementById('eyeSlashIcon');
    
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      if (isPassword) {
        eyeIcon.classList.add('d-none');
        eyeSlashIcon.classList.remove('d-none');
      } else {
        eyeIcon.classList.remove('d-none');
        eyeSlashIcon.classList.add('d-none');
      }
    });

    // Simulated actions
    function socialLogin(service) {
      alert(`Connecting RV Owner credentials via ${service} secure gateway...`);
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Authenticating RV Owner...';
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 900);
    });
  </script>
</body>
